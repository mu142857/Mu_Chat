<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>微信回复助手</title>
  <meta name="description" content="粘贴微信对话，按朋友档案生成候选回复">
  <meta name="theme-color" content="#f5f6f7">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="回复助手">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main id="app">

    <!-- 主界面：回复助手 -->
    <section id="view-chat" class="view">
      <header class="view-header">
        <h1>回复助手</h1>
        <div class="header-actions">
          <button id="btn-summary" class="btn-ghost" type="button">总结</button>
          <button id="btn-new-chat" class="btn-ghost" type="button">新对话</button>
        </div>
      </header>

      <div id="persona-area" class="persona-area"></div>

      <!-- 宽屏分两栏：右=参谋输出流，左=微信对话流+粘贴框；窄屏两栏塌回一条时间线 -->
      <div class="chat-layout">
        <div class="col-right">
          <div class="col-head">参谋分析 · 建议</div>
          <div id="chat-area" class="chat-area"></div>
        </div>
        <div class="col-left">
          <div class="col-head">微信对话</div>
          <div id="wx-area" class="wx-area"></div>
          <div class="compose-convo">
            <div class="compose-convo-head">
              贴新消息 <span class="convo-hint">一框一个人的话，贴完点发送；没有新消息可留空</span>
            </div>
            <div id="conversation-area" class="conversation-area"></div>
          </div>
        </div>
      </div>
    </section>

    <!-- 档案管理页 -->
    <section id="view-manage" class="view" hidden>
      <header class="view-header">
        <h1>档案</h1>
      </header>
      <div id="profiles-section"></div>
      <div id="presets-section"></div>
      <div id="memes-section"></div>
      <div id="settings-section"></div>
    </section>

  </main>

  <!-- 底部输入条（仅回复页显示） -->
  <div id="composer" class="composer">
    <div class="composer-inner">
      <textarea id="chat-input" rows="1"
        placeholder="你的想法 / 追问 / 要求…（上方贴好对话可直接发）"></textarea>
      <button id="btn-send" class="btn-send" type="button">发送</button>
    </div>
  </div>

  <!-- 底部 tab 栏 -->
  <nav class="tab-bar">
    <button class="tab-btn active" data-view="chat" type="button">回复</button>
    <button class="tab-btn" data-view="manage" type="button">档案</button>
  </nav>

  <div id="modal-root"></div>
  <div id="toast-root"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
